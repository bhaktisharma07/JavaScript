<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chai aur Code</title>
</head>

<body style="background-color: #212121; color: #fff;">

    <ul class="language">
        <li>JavaScript</li>
    </ul>

</body>

<script>

    // ADD LANGUAGE

    function addLanguage(langName) {

        const li = document.createElement("li")

        li.innerHTML = `${langName}`

        document.querySelector(".language").appendChild(li)
    }

    /*
    createElement se new li element create kiya

    innerHTML se uske andar language ka naam add kiya

    appendChild se li ko ul ke andar add kiya
    */

    addLanguage("Python")
    addLanguage("TypeScript")


    // OPTIMIZED WAY

    function addOptiLanguage(langName) {

        const li = document.createElement("li")

        li.appendChild(document.createTextNode(langName))

        document.querySelector(".language").appendChild(li)
    }

    /*
    createTextNode directly text node create karta hai

    appendChild se text node ko li ke andar add kiya

    Fir li ko ul ke andar add kiya

    Ye innerHTML ki comparison me safer approach hai
    */

    addOptiLanguage("GoLang")


    // EDIT

    const secondLang = document.querySelector("li:nth-child(2)")

    console.log(secondLang)

    /*
    nth-child(2) second li element ko select karta hai

    Yaha Python wala li select hoga
    */


    // secondLang.innerHTML = "Mojo"


    // REPLACE ELEMENT

    const newLi = document.createElement("li")

    newLi.textContent = "Mojo"

    secondLang.replaceWith(newLi)

    /*
    New li element create kiya

    Usme Mojo text add kiya

    replaceWith se old Python element ko
    new Mojo element se replace kar diya
    */


    // EDIT USING outerHTML

    const firstLang = document.querySelector("li:first-child")

    firstLang.outerHTML = "<li>TypeScript</li>"

    /*
    first-child first li element ko select karta hai

    outerHTML se pura element replace kar sakte hain

    Yaha JavaScript wala li
    TypeScript wale li se replace ho gaya
    */


    // REMOVE

    const lastLang = document.querySelector("li:last-child")

    lastLang.remove()

    /*
    last-child last li element ko select karta hai

    remove() element ko DOM se completely remove kar deta hai
    */

</script>

</html>
